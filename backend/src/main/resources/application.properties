spring.application.name=greenlink
server.port=${PORT:5000}
spring.data.mongodb.uri=${MONGO_URI:mongodb://localhost:27017/greenlink}
spring.data.mongodb.auto-index-creation=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.jwt.secret=${JWT_SECRET:change-this-secret-to-a-long-random-value-at-least-32-characters}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
app.upload-dir=${UPLOAD_DIR:uploads}
